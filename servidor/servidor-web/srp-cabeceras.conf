# SRP · cabeceras de seguridad. srp.conf lo incluye en cada una de sus ubicaciones. En nginx, un add_header dentro de
# una ubicación deja de heredar las cabeceras globales del sitio; por eso aquí van todas, como en Categorías: las
# globales del SIA y la política de seguridad de contenido del SRP. Sin HSTS: lo decide el SIA para todo el dominio.
# pruebas/servir.py lee este archivo y manda las mismas cabeceras, así que todas las pruebas corren con ellas.

# Las globales del sitio
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# El SRP no dice desde dónde se pide nada, tampoco al mapa base (index.html lo dice también en su <meta>)
add_header Referrer-Policy "no-referrer" always;
# El GPS, sí, en el propio sitio; la cámara, no: la fotografía entra por <input type="file">, sin tomar la cámara directo
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

# La política de seguridad de contenido: la misma de index.html, más frame-ancestors, que sólo vale como cabecera. Sólo
# corre código de este sitio; las imágenes pueden venir del sitio, de datos incrustados y del mapa base. Si cambia el
# proveedor del mapa (js/config.js, MAPA.CAPAS), su dominio cambia aquí y en index.html (pruebas/auditoria.py las compara)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://server.arcgisonline.com; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
