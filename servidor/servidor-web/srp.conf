# SRP · fragmento para el servidor web (nginx) del SIA. Lo integra el equipo del SIA: la ruta de disco, la de los
# fragmentos y el destino del backend los pone él.
#
# La aplicación es estática y funciona sin señal: un service worker guarda sus archivos, y cada archivo
# lleva su versión en la dirección (?v=). La aplicación va en /srp/ y su API en /srp/api/, como Categorías:
# la cookie de la sesión queda dentro de /srp/. /api/srp/ no existe.
#
# Reglas del SIA para todo fragmento:
#   - absolute_redirect off en cada redirección: el cifrado termina antes del servidor web, y sin él la
#     redirección apuntaría a http://.
#   - Sin Strict-Transport-Security: lo decide el SIA para todo el dominio.
#   - Las cabeceras de seguridad van en srp-cabeceras.conf, incluido en CADA ubicación, también en las anidadas:
#     en nginx, un add_header dentro de una location deja de heredar las globales del sitio, así que ese archivo
#     repite las globales (con la protección contra marcos) y agrega la política de seguridad de contenido del SRP.
#     Para la caché, expires, que no es add_header.
#   - La entrada de sesión, con el límite de velocidad que el SIA ya tiene para eso.

# /srp sin diagonal final lleva a /srp/
location = /srp {
    include /RUTA/DE/LOS/FRAGMENTOS/srp-cabeceras.conf;
    absolute_redirect off;
    return 301 /srp/;
}

# La aplicación. La página y el service worker no se guardan en caché, para que una versión nueva llegue
# en cuanto se publica; lo demás lleva su versión en la dirección y se guarda 30 días.
# root y no alias: con alias, las ubicaciones anidadas resuelven mal la ruta del archivo. Con root,
# /srp/x sale de /RUTA/QUE/DEFINE/EL/SIA/srp/x.
# ^~: lo que empieza con /srp/ no pasa por las reglas de expresión regular del server (por ejemplo, una
# `location ~* \.(js|css|txt)$` de caché de estáticos), que lo buscarían en otra carpeta. Las ubicaciones
# anidadas de aquí sí se revisan. Si el SIA cambia esta ubicación, que conserve el ^~.
location ^~ /srp/ {
    include /RUTA/DE/LOS/FRAGMENTOS/srp-cabeceras.conf;
    root /RUTA/QUE/DEFINE/EL/SIA;
    index index.html;
    location ~* /(index\.html|sw\.js)$ {
        include /RUTA/DE/LOS/FRAGMENTOS/srp-cabeceras.conf;
        expires -1;
    }
    # El manifiesto de la aplicación instalable: con su tipo, que no todos los servidores traen, y sin versión
    location ~* \.webmanifest$ {
        include /RUTA/DE/LOS/FRAGMENTOS/srp-cabeceras.conf;
        types { application/manifest+json webmanifest; }
        expires -1;
    }
    location ~* \.(js|css|png|jpg|svg|webp|woff2|ttf|json)$ {
        include /RUTA/DE/LOS/FRAGMENTOS/srp-cabeceras.conf;
        expires 30d;
    }
}

# La API, al backend del SIA, donde el módulo se monta en /api/srp, como los demás: /srp/api/x pasa a /api/srp/x,
# igual que Categorías. Es más larga que /srp/ y también lleva ^~, así que le gana a la ubicación de la aplicación.
# Las cabeceras del proxy, las mismas que la API de Categorías. Una fotografía llega a 1 MB; el resto, hasta 80 KB de
# JSON. /api/srp/ no se publica: el SIA la cierra con 404.
location ^~ /srp/api/ {
    include /RUTA/DE/LOS/FRAGMENTOS/srp-cabeceras.conf;
    proxy_pass http://BACKEND_DEL_SIA/api/srp/;   # el mismo destino que las demás API del SIA
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# La entrada de sesión, con límite de velocidad
location = /srp/api/acceso/entrar {
    include /RUTA/DE/LOS/FRAGMENTOS/srp-cabeceras.conf;
    limit_req zone=auth;   # la zona y sus parámetros, los que el SIA usa en sus otras entradas
    proxy_pass http://BACKEND_DEL_SIA/api/srp/acceso/entrar;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
