# SRP · fragmento para el servidor web (nginx) del SIA. Lo integra el equipo del SIA: la ruta de disco y el
# destino del backend los pone él. La ruta pública /srp/ está por confirmar con el SIA.
#
# La aplicación es estática y funciona sin señal: un service worker guarda sus archivos, y cada archivo
# lleva su versión en la dirección (?v=). La API va por la ubicación /api/ que el SIA ya reenvía a su
# backend, en /api/srp/.
#
# Reglas del SIA para todo fragmento:
#   - absolute_redirect off en cada redirección: el cifrado termina antes del servidor web, y sin él la
#     redirección apuntaría a http://.
#   - Sin Strict-Transport-Security: lo decide el SIA para todo el dominio.
#   - Sin add_header en estas ubicaciones: en nginx, un add_header dentro de una location borra las
#     cabeceras de seguridad que el SIA pone para todo el sitio. Para la caché, expires.
#   - La entrada de sesión, con el límite de velocidad que el SIA ya tiene para eso.

# /srp sin diagonal final lleva a /srp/
location = /srp {
    absolute_redirect off;
    return 301 /srp/;
}

# La aplicación. La página y el service worker no se guardan en caché, para que una versión nueva llegue
# en cuanto se publica; lo demás lleva su versión en la dirección y se guarda 30 días.
# root y no alias: con alias, las ubicaciones anidadas resuelven mal la ruta del archivo. Con root,
# /srp/x sale de /RUTA/QUE/DEFINE/EL/SIA/srp/x.
location /srp/ {
    root /RUTA/QUE/DEFINE/EL/SIA;
    index index.html;
    location ~* /(index\.html|sw\.js)$ { expires -1; }
    # El manifiesto de la aplicación instalable: con su tipo, que no todos los servidores traen, y sin versión
    location ~* \.webmanifest$ { types { application/manifest+json webmanifest; } expires -1; }
    location ~* \.(js|css|png|jpg|svg|webp|woff2|ttf|json)$ { expires 30d; }
}

# La entrada de sesión, con límite de velocidad. El resto de /api/srp/ va por la ubicación /api/ del SIA.
location = /api/srp/acceso/entrar {
    limit_req zone=auth;   # la zona y sus parámetros, los que el SIA usa en sus otras entradas
    proxy_pass http://BACKEND_DEL_SIA;   # el mismo destino que la ubicación /api/ del SIA
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
