# B9 · nginx local que imita al del SIA para el SRP (revisor r4). Puerto 8124 (el de «app real» de r4).
# La aplicación en /srp/ con el fragmento del paquete tal cual (srp-r4.conf es servidor-web/srp.conf con la ruta
# de disco y el destino del backend puestos), y /api/ reenviada al servicio local en 3124, como la ubicación /api/
# que el SIA ya tiene. Las cabeceras del server imitan las que el SIA pone para todo el sitio (no se conocen: sólo nosniff).
worker_processes 1;
events { worker_connections 256; }
http {
  include mime.types;
  default_type application/octet-stream;
  limit_req_zone $binary_remote_addr zone=auth:1m rate=30r/m;
  server {
    listen 127.0.0.1:8124;
    add_header X-Content-Type-Options "nosniff" always;
    location / { return 404; }
    location /api/ {
      proxy_pass http://127.0.0.1:3124;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      client_max_body_size 2m;
    }
    include C:/sia-rev/tmp/aud1027/r4/evidencia/nginx/conf/srp-r4.conf;
  }
}
